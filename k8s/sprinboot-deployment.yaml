apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine-springboot-app
  labels:
    app: mine-springboot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mine-springboot-app
  template:
    metadata:
      labels:
        app: mine-springboot-app
    spec:
      containers:
        - name: mine-springboot-app
          image: "__IMAGE_URI__"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mine-springboot-app
  labels:
    app: mine-springboot-app
spec:
  type: LoadBalancer
  selector:
    app: mine-springboot-app
  ports:
    - port: 80
      targetPort: 8080